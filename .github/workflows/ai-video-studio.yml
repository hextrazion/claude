name: AI Video Studio (Windows installer)

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'ai-video-studio/**'
      - '.github/workflows/ai-video-studio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-video-studio-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ai-video-studio

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-video-studio/app/frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-video-studio/requirements*.txt

      - name: Download FFmpeg (bundled into the app)
        shell: pwsh
        run: |
          $urls = @(
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-7.1.zip',
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          )
          foreach ($u in $urls) {
            try { Invoke-WebRequest -Uri $u -OutFile ffmpeg.zip; break } catch { Write-Host "Failed: $u" }
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $bin = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force tools/ffmpeg/bin | Out-Null
          Copy-Item "$($bin.DirectoryName)\ffmpeg.exe","$($bin.DirectoryName)\ffprobe.exe" tools/ffmpeg/bin/
          Get-ChildItem $bin.Directory.Parent.FullName -Filter LICENSE* | Copy-Item -Destination tools/ffmpeg/
          "$PWD\tools\ffmpeg\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & tools/ffmpeg/bin/ffmpeg.exe -hide_banner -version | Select-Object -First 1
          $filters = & tools/ffmpeg/bin/ffmpeg.exe -hide_banner -filters
          foreach ($f in 'subtitles','xfade','loudnorm','drawtext') {
            if (-not ($filters -match "\s$f\s")) { throw "FFmpeg build lacks the $f filter" }
          }

      - name: Build web UI
        working-directory: ai-video-studio/app/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller==6.22.3 pystray==0.19.5 pillow==13.0.0

      - name: Backend tests on Windows (real FFmpeg)
        run: python -m pytest -q

      - name: Build app with PyInstaller
        run: |
          python packaging/make_icon.py
          python packaging/build_app.py

      - name: Smoke-test the built app
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\studio-smoke"
          $env:STUDIO_NO_WINDOW = '1'
          $env:STUDIO_NO_TRAY = '1'
          $p = Start-Process -FilePath "dist\AI Video Studio\AI Video Studio.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try { $h = Invoke-RestMethod http://127.0.0.1:8765/api/health; if ($h.ok) { $ok = $true; break } } catch {}
          }
          if (-not $ok) { Get-Content "$env:LOCALAPPDATA\AI Video Studio\logs\*" -ErrorAction SilentlyContinue; throw "App did not start" }
          $html = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing
          if ($html.Content -notmatch 'AI Video Studio') { throw "UI not served" }
          $ff = Invoke-RestMethod -Method Post http://127.0.0.1:8765/api/integrations/ffmpeg/test -Headers @{ 'X-Studio-Client' = 'web' }
          Write-Host "FFmpeg check: $($ff.health.status) - $($ff.health.message)"
          if ($ff.health.status -ne 'ok') { throw "Bundled FFmpeg not detected" }
          Stop-Process -Id $p.Id -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = (Select-String -Path app/backend/studio/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-Item dist-installer\AI-Video-Studio-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Studio-Setup
          path: ai-video-studio/dist-installer/AI-Video-Studio-Setup.exe
          if-no-files-found: error

      - name: Publish download link (release "ai-video-studio-latest")
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ai-video-studio-latest --yes --cleanup-tag || true
          gh release create ai-video-studio-latest dist-installer/AI-Video-Studio-Setup.exe \
            --target "$GITHUB_SHA" --prerelease \
            --title "AI Video Studio — Windows installer (latest build)" \
            --notes "Download **AI-Video-Studio-Setup.exe**, double-click it, and follow the two-click installer. Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Windows may say it protected your PC because the installer isn't code-signed: click **More info → Run anyway**."
