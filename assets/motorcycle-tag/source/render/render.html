<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: transparent; } canvas { display: block; }</style>
<script type="importmap">{"imports": {"three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
// Loads one bike GLB, optionally swaps its skin, poses the steering and renders on a transparent background.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const W = 640, H = 480;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.4);
sun.position.set(-6, 12, -5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7 });
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbfd4ff, 0.8);
fill.position.set(6, 4, 6);
scene.add(fill);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.25 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 200);
const loader = new GLTFLoader();
const textures = new THREE.TextureLoader();
let bike = null;

window.renderJob = async (job) => {
  if (bike) scene.remove(bike);
  bike = (await loader.loadAsync(job.model)).scene;
  bike.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(bike);
  if (job.skin) {
    const map = await textures.loadAsync(job.skin);
    map.flipY = false;
    map.colorSpace = THREE.SRGBColorSpace;
    map.anisotropy = 8;
    bike.traverse((o) => { if (o.isMesh) { o.material = o.material.clone(); o.material.map = map; } });
  }
  if (job.steerDeg) {
    const rake = job.rake * Math.PI / 180;
    const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, Math.cos(rake), Math.sin(rake)), job.steerDeg * Math.PI / 180);
    const pivot = bike.getObjectByName('FrontWheel').position.clone();
    for (const name of job.steer.concat(['FrontWheel'])) {
      const o = bike.getObjectByName(name);
      o.position.sub(pivot).applyQuaternion(q).add(pivot);
      o.quaternion.premultiply(q);
    }
  }
  const [px, py, pz, tx, ty, tz] = job.camera;
  camera.position.set(px, py, pz);
  camera.lookAt(tx, ty, tz);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script>
</body>
</html>
